name: Code quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://indianrestaurantlondon.co.uk

jobs:
  fast-quality-gate:
    name: Fast quality gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Enforce dependency policy
        run: npm run audit:dependencies

      - name: Verify publication integrity
        run: npm run audit:publication

      - name: Verify SEO and crawl policy
        run: |
          npm run audit:seo
          npm run audit:indexation
          npm run audit:links

      - name: Verify template readiness
        run: npm run audit:template

      - name: Build production application
        run: npm run build

      - name: Confirm checks did not edit tracked files
        run: |
          git diff --check
          if (git status --porcelain) {
            git status --short
            throw "Quality checks changed tracked or untracked repository files."
          }

  full-static-export:
    name: Full static export and rendered benchmark
    if: github.event_name != 'pull_request'
    needs: fast-quality-gate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:static

      - name: Validate Cloudflare artifact
        run: npm run check:cloudflare

      - name: Run rendered filter benchmark
        shell: powershell
        env:
          RUNS: "3"
          CPU_THROTTLE: "4"
          BASE_URL: http://127.0.0.1:3000
        run: |
          $server = Start-Process python -ArgumentList @(
            "-m",
            "http.server",
            "3000",
            "--bind",
            "127.0.0.1",
            "--directory",
            "out"
          ) -WindowStyle Hidden -PassThru

          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt += 1) {
              try {
                $response = Invoke-WebRequest -Uri "$env:BASE_URL/restaurants/" -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
              }
              Start-Sleep -Milliseconds 250
            }

            if (-not $ready) {
              throw "Static export server did not become ready."
            }

            npm run benchmark:filters
            if ($LASTEXITCODE -ne 0) {
              throw "Rendered filter benchmark failed with exit code $LASTEXITCODE."
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Confirm export left source clean
        run: |
          git diff --check
          if (git status --porcelain) {
            git status --short
            throw "Static export changed tracked or untracked repository files."
          }
