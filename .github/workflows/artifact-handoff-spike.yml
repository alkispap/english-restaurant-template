name: Non-production artifact handoff spike

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: https://indianrestaurantlondon.co.uk

jobs:
  build-and-upload:
    name: Build and upload candidate
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}

    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build static candidate
        run: npm run build:static

      - name: Create local candidate evidence
        shell: powershell
        run: |
          $commit = '${{ github.sha }}'
          $createdAt = (Get-Date).ToUniversalTime().ToString('o')
          $expiresAt = (Get-Date).ToUniversalTime().AddDays(7).ToString('o')
          npm run create:release-candidate -- `
            --artifact=out `
            --evidence-directory="$env:RUNNER_TEMP\release-candidate-evidence" `
            --branch='${{ github.ref_name }}' `
            --commit=$commit `
            --production-url="$env:NEXT_PUBLIC_SITE_URL" `
            --created-at=$createdAt `
            --expires-at=$expiresAt

      - name: Stage candidate for artifact transfer
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'release-candidate-transfer'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath out -Destination (Join-Path $stage 'out') -Recurse
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'release-candidate-evidence') -Destination (Join-Path $stage 'evidence') -Recurse

      - name: Upload non-production candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/release-candidate-transfer
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  download-and-verify:
    name: Download and verify candidate
    needs: build-and-upload
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-and-upload.outputs.artifact-id }}
          path: ${{ runner.temp }}/downloaded-candidate

      - name: Verify downloaded candidate
        shell: powershell
        run: |
          $verifiedAt = (Get-Date).ToUniversalTime().ToString('o')
          npm run verify:release-candidate -- `
            --artifact="$env:RUNNER_TEMP\downloaded-candidate\out" `
            --evidence-directory="$env:RUNNER_TEMP\downloaded-candidate\evidence" `
            --branch='${{ github.ref_name }}' `
            --commit='${{ github.sha }}' `
            --production-url="$env:NEXT_PUBLIC_SITE_URL" `
            --verified-at=$verifiedAt

      - name: Record immutable transfer identifiers
        shell: powershell
        run: |
          "artifact-id=${{ needs.build-and-upload.outputs.artifact-id }}"
          "artifact-digest=${{ needs.build-and-upload.outputs.artifact-digest }}"
          "artifact-url=${{ needs.build-and-upload.outputs.artifact-url }}"
